<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AQ Caterings · Catering & Decor</title>
    <meta
      name="description"
      content="Elegant decor and delicious food for your Walima, Mehndi, Barat and Qawwali nights."
    />
    <meta name="theme-color" content="#5B2A4A" />

    <!-- Default link preview (WhatsApp, Instagram, Facebook, X).
         VITE_SITE_URL is your live domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AQ Caterings" />
    <meta property="og:title" content="AQ Caterings · Catering & Decor" />
    <meta
      property="og:description"
      content="Elegant decor and delicious food for your Walima, Mehndi, Barat and Qawwali nights."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AQ Caterings · Catering & Decor" />
    <meta
      name="twitter:description"
      content="Elegant decor and delicious food for your Walima, Mehndi, Barat and Qawwali nights."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-default.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Apply a saved Urdu choice before React loads, so there is no LTR flash. -->
    <script>
      try {
        if (localStorage.getItem('aq_lang') === 'ur' && !location.pathname.startsWith('/admin')) {
          document.documentElement.lang = 'ur'
          document.documentElement.dir = 'rtl'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
